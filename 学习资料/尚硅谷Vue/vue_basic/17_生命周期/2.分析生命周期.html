<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>分析生命周期</title>
		<!-- 引入Vue -->
		<script type="text/javascript" src="../js/vue.js"></script>
	</head>
	<body>
		<!-- 准备好一个容器-->
		<div id="root" :x="n">
			<h2 v-text="n"></h2>
			<h2>当前的n值是：{{n}}</h2>
			<button @click="add">点我n+1</button>
			<button @click="bye">点我销毁vm</button>
		</div>
	</body>

	<script type="text/javascript">
		Vue.config.productionTip = false //阻止 vue 在启动时生成生产提示。

		new Vue({
			el:'#root',
			// template:`
			// 	<div>
			// 		<h2>当前的n值是：{{n}}</h2>
			// 		<button @click="add">点我n+1</button>
			// 	</div>
			// `,
			data:{
				n:1
			},
			methods: {
				add(){
					console.log('add')
					this.n++
				},
				bye(){
					console.log('bye')
					this.$destroy()
				}
			},
			watch:{
				n(){
					console.log('n变了')
				}
			},
			beforeCreate() {
				console.log('beforeCreate')// 数据还未代理
			},
			created() {
				console.log('created')// 数据已经代理，可以使用this
			},
			beforeMount() {
				console.log('beforeMount')// 未经编译的DOM结构，对DOM的操作最终不生效
			},
			mounted() {
				console.log('mounted')// 编译后的DOM结构，可操作DOM
			},
			beforeUpdate() {
				console.log('beforeUpdate')// 数据是新的，页面是旧的
			},
			updated() {
				console.log('updated')// 根据新数据，生成新的虚拟DOM，随后与旧的虚拟DOM对比，最终完成页面更新
			},
			beforeDestroy() {
				console.log('beforeDestroy')// this 、data等都可用，一般在这里关闭定时器取消订阅等操作
			},
			destroyed() {
				console.log('destroyed')
			},
		})
	</script>
</html>
