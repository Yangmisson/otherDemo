<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        margin: 20px;
      }
      p span {
        float: left;
        margin: 20px;
        width: 20px;
        height: 15px;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <p>标准模型与IE模型</p>
    <p>区别？</p>
    <p>如何设置</p>
    <ul>
      <li>dom.style.width/height 内联样式</li>
      <li>dom.currentStyle.width/height 渲染以后的样式（只有IE支持）</li>
      <li>window.getComputedStyle(dom).width/height 渲染以后的样式</li>
      <li>
        dom.getBoundingClient().width/height
        计算一个元素的绝对位置（left、top、width、heigth）
      </li>
    </ul>
    <p>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </p>
    <p>html document.documentElement</p>

    <script>
      let arr = [10, 20, 30],
        obj = { a: 100 };
      function fun(...arg) {
        console.log(this);
        console.log(arg);
        let result = 0;
        arg.forEach((item) => {
          result += item * this.a;
        });
        console.log(result);
      }
      fun.call(obj, ...arr);
      Function.prototype.myCall = function (obj, ...arg) {
        let myCallKey = Symbol("fn");
        obj = obj === null || obj === undefined ? globalThis : Object(obj);
        Object.defineProperty(obj, myCallKey, {
          enumerable: false,
          value: this,
        });
        var result = obj[myCallKey](...arg);
        delete obj[myCallKey];
        return result;
      };
      fun.myCall(obj, ...arr);
    </script>
  </body>
</html>
