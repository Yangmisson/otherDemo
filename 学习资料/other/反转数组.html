<body>
    <script>
        Array.prototype.reverseArr = function () {
            let result = [];
            console.log(this)
            for (var i = this.length - 1; i >= 0; i--) {
                result.push(this[i])
            }
            return result;
        }

        var arr = [55, 6, 8, 45, 63, 12];
        console.log(arr.reverseArr());


    </script>
