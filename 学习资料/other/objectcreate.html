<!DOCTYPE html>

  <body>
    <script>
      let obj = {
        name: "Yang",
        sex: "boy",
        fav: "money",
      };
      const me = Object.create(obj);
      console.log(me);

      for (let key in obj) {
        let val = obj[key];
        Object.defineProperty(obj, key, {
          //当且仅当该属性的 configurable 键值为 true 时，
          //该属性的描述符才能够被改变，同时该属性也能从对应的对象上被删除。
          configurable: true,
          //当且仅当该属性的 enumerable 键值为 true 时，该属性才会出现在对象的枚举属性中。
          enumerable: true,
          // value:val,
          // writable:true,
          get() {
            console.log("getter", val);
            return val;
          },
          set(newVal) {
            val = newVal;
            console.log("setter");
            console.log(obj);
          },
        });
      }

      /*         var a = 0
