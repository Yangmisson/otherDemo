<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        /* 
            一个url地址到最终的页面渲染，发生了什么？
            1.DNS解析，将域名解析为ip地址
              -读取浏览器DNS缓存
              -系统DNS缓存
              -路由器DNS缓存
              -网络运营商DNS缓存
              -递归搜索：blog.baidu.com
                        -.com域名下查找DNS解析
                        -.baidu域名下查找DNS解析
                        -blog域名下查找DNS解析
                        -出错了
            2.TCP链接，TCP三次握手
              -第一次握手，由浏览器发起，告诉服务器我要发送请求了
              -第二次握手，由服务器发起，告诉浏览器我准备接收了，你可以发送了
              -第三次握手，由浏览器发送，告诉服务器，我马上发送，你准备接收
            3.发送请求
              -请求报文：http协议的通信内容
            4.接受响应
              -响应报文
            5.渲染页面
            6.断开连接，TCP四次挥手
              -第一次挥手，由浏览器发起，告诉服务器，我东西发送完了（请求报文），你准备关闭吧
              -第二次挥手，由服务器发起，告诉浏览器，我东西接收完了（请求报文），我准备关闭了，你也准备吧
              -第三次挥手，由服务器发起，告诉浏览器，我东西发送完了（响应报文），你准备关闭吧
              -第四次挥手，由浏览器发起，告诉服务器，我东西接收完了（响应报文），我准备关闭了，你也关闭吧
         */
    </script>
</body>

</html>
