<body>
    <script>
        Array.prototype.heavy = function () {
            let result = [];
            result[0] = this[0];
            for (var i = 1; i < this.length; i++) {
                let flag = false;
                for (let j = 0; j < result.length; j++) {
                    if (this[i] === result[j]) {
                        flag = true;
                        break;
                    }
                }
                if (!flag) {
                    result.push(this[i])
                }
            }
            return result;
        }

        var arr = [55, 55, 6, 8, 45, 63, 12, 6, 6, 0, 7, 45, 63];
        console.log(arr.heavy());


    </script>
</body>
