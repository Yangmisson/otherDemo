<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .btn {
            width: 100px;
            height: 44px;
            background-color: #38f;
            color: #fff;
            border: none;
            font-size: 16px;
            /* 重置为最初样式 */
            /* all: revert; */
        }

        .btn:hover {
            background-color: rgb(32, 99, 192);
        }

        .div1 {
            width: 80%;
            margin: 20px auto;
            /* margin-left: auto; */
            height: 300px;
            background-color: orange;
            overflow: hidden;
        }

        .div2 {
            width: inherit;
            height: calc(100% - 40px);
            margin: inherit;
            background-color: rgb(32, 99, 192);
            overflow: hidden;
        }

        .list {
            display: block;
            padding: 10px;
            margin-left: 100px;
            background-color: #38f;
        }
    </style>
</head>

<body>
    <button class="btn">我是按钮</button>
    <div class="div1">
        <div class="div2"></div>
    </div>
    <ul class="list">
        <li>width: inherit; 继承父元素的宽度</li>
        <li>height: calc(100% - 40px); 计算高度，100%是父元素的高度，减去40px</li>
        <li>margin: inherit; 继承父元素的外边距</li>
    </ul>
</body>

</html>
