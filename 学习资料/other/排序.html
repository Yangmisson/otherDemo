<!DOCTYPE html>
<html manifest="demo.appcache">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>

  <body></body>
  <script>
    var arr = [56, 45, 78, 23, 15, 3, 64, 9];
    // 冒泡排序
    function bubble(arr) {
      // 外层循环控制比较的轮数
      for (var i = 0; i < arr.length - 1; i++) {
        // 里层循环控制每一轮比较的次数
        for (var j = 0; j < arr.length - 1 - i; j++) {
          if (arr[j] > arr[j + 1]) {
            var temp = arr[j + 1];
            arr[j + 1] = arr[j];
            arr[j] = temp;
          }
        }
      }
      return arr;
    }
    // 插入排序
    function insert(arr) {
      var result = [arr[0]];
      for (var i = 1; i < arr.length; i++) {
        for (var j = result.length; j >= 0; j--) {
          if (j === 0) {
            result.unshift(arr[i]);
            break;
          }
          if (arr[i].chunkIndex > result[j - 1].chunkIndex) {
            result.splice(j, 0, arr[i]);
            break;
          }
        }
      }
      return result;
    }
    // 快速排序
    function quick(arr) {
      if (arr.length <= 1) {
        return arr;
      }
      var leftArr = [],
        rightArr = [],
        middleIndex = Math.floor(arr.length / 2),
        middValue = arr.splice(middleIndex, 1)[0];

      for (var i = 0; i < arr.length; i++) {
        arr[i] > middValue ? rightArr.push(arr[i]) : leftArr.push(arr[i]);
      }
      return quick(leftArr).concat(middValue, quick(rightArr));
    }

    arr = [
      { path: "", type: "chunk", chunkIndex: 1 },
      { path: "", type: "chunk", chunkIndex: 99 },
      { path: "", type: "chunk", chunkIndex: 24 },
      { path: "", type: "chunk", chunkIndex: 6 },
      { path: "", type: "chunk", chunkIndex: 45 },
      { path: "", type: "chunk", chunkIndex: 7 },
      { path: "", type: "chunk", chunkIndex: 66 },
    ];
    console.log(insert(arr));
  </script>
</html>
