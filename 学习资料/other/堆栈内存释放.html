<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="../images//ECstack.png" alt="" />
    <script>
      /*
    JS中的内存分为堆内存和栈内存
        堆内存：存储引用数据类型值（对象：键值对  函数：函数字符串）
        堆内存：提供JS代码执行的环境和存储基本数据类型

    【堆内存释放】
        让所以引用堆内存空间地址变量为null(没有变量占用内存，浏览器会在空闲的时候释放掉)
    【栈内存释放】
        一般情况下当函数执行完成，所形成的私有作用域（栈内存）都会释放掉（在栈内存中存储的
        值也都会释放掉），但是也有特殊不销毁的情况：
            1.函数执行完成，当前形成的栈内存中，某些内容被栈内存以外的变量占用了，
            此时栈内存不能释放（一旦释放外面找不到原有的内容了）
            2.全局栈内存只有在页面关闭的时候才会被释放掉
            如果当前栈内存没有被释放，那么之前在栈内存中存储的基本值也不会被释放，能够一直
            保存下来
    */
      var i = 1; //2
      function fn(i) {
        return function (n) {
          console.log(n + ++i);
        };
      }
      var f = fn(2); // f = function(n){ console.log(n+(++2)); }
      f(3); // 6
      fn(5)(6); // 12
      fn(7)(8); // 16
      f(4); // 8
    </script>
  </body>
</html>
