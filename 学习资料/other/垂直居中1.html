<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            border: 1px solid red;
            height: 500px;
            position: relative;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: rebeccapurple;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            right: 0;
            margin: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
