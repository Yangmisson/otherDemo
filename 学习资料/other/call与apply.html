    function currying(add) {
      return function (...args) {
        if (args.length == 0) {
          return add(...args);
        }
        return currying(add.bind(null, ...args));
      };
    }

    function add(...args) {
      return args.reduce((total, num) => {
        return total + num;
      });
    }

    add = currying(add);
    console.log(add(1)()); //1
    console.log(add(1)(2, 3)()); //6
