<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSS 文件上传</title>
  <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.23.0.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6f8;
      color: #1f2937;
    }

    main {
      width: min(92vw, 560px);
      padding: 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="file"],
    input[type="password"],
    select {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px 16px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    #cancelButton {
      background: #6b7280;
    }

    #preview {
      margin-top: 12px;
    }

    #preview[hidden] {
      display: none;
    }

    #imagePreview {
      display: block;
      max-width: 100%;
      max-height: 320px;
      object-fit: contain;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
    }

    progress {
      width: 100%;
      height: 12px;
      margin-top: 20px;
    }

    #status {
      min-height: 24px;
      margin: 16px 0 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #result {
      margin-top: 12px;
      word-break: break-all;
    }

    #result[hidden] {
      display: none;
    }

    #result a {
      color: #2563eb;
    }
  </style>
</head>

<body>
  <main>
    <h1>OSS 文件上传</h1>
    <form id="uploadForm">
      <label for="file">选择文件</label>
      <input id="file" type="file" accept="image/*" required>
      <div id="preview" hidden>
        <img id="imagePreview" alt="所选图片预览">
      </div>

      <label for="authorization">Basic Authorization（不会保存）</label>
      <input id="authorization" value="Basic YnBtYWRtaW46YnBtQWRtaW5AMjAxOQ==" type="password" autocomplete="off"
        placeholder="Basic ..." required>

      <label for="uploadMode">上传方式</label>
      <select id="uploadMode">
        <option value="multipart">分片上传</option>
        <option value="put">普通上传</option>
      </select>

      <button id="uploadButton" type="submit">开始上传</button>
      <button id="cancelButton" type="button" disabled>取消上传</button>
    </form>
    <progress id="progress" value="0" max="100" hidden></progress>
    <p id="status" role="status"></p>
    <p id="result"></p>
  </main>

  <script type="module">
    import { uploadFile } from './uploadFile.js';

    // 获取页面元素，用于读取输入并更新上传状态。
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('file');
    const preview = document.getElementById('preview');
    const imagePreview = document.getElementById('imagePreview');
    const authorizationInput = document.getElementById('authorization');
    const uploadModeInput = document.getElementById('uploadMode');
    const uploadButton = document.getElementById('uploadButton');
    const cancelButton = document.getElementById('cancelButton');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    console.dir(fileInput);

    // 选择图片后使用 FileReader 转换为 Base64，仅用于本地预览。
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      preview.hidden = true;
      imagePreview.removeAttribute('src');

      if (!file || !file.type.startsWith('image/')) return;

      // readAsDataURL 读取完成后，reader.result 就是图片的 Base64 Data URL。
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        imagePreview.src = reader.result;
        preview.hidden = false;
      });
      reader.addEventListener('error', () => {
        status.textContent = '图片预览读取失败。';
      });
      reader.readAsDataURL(file);
    });

    // 凭证获取由调用方负责。这里使用 XMLHttpRequest 作为示例，
    // 其他项目可以替换成 wx.request、axios 或自己的网络请求方法。
    function getCredentials(authorization) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open('GET', 'https://uatminivisit.hkbf.com.cn/api/yAgencyMiniProgram/basic/v1/getAliCloudSts');
        request.setRequestHeader('Authorization', authorization);
        request.onreadystatechange = () => {
          if (request.readyState !== XMLHttpRequest.DONE) return;

          let data;
          try {
            data = JSON.parse(request.responseText);
          } catch {
            reject(new Error('临时凭证接口返回的不是有效 JSON'));
            return;
          }

          if (request.status < 200 || request.status >= 300 || !data.state || !data.value) {
            reject(new Error(data.message || `获取临时凭证失败（HTTP ${request.status}）`));
            return;
          }
          resolve(data.value);
        };
        request.onerror = () => reject(new Error('临时凭证请求失败'));
        request.send();
      });
    }

    // 保存当前任务，取消按钮通过任务的 cancel() 中止上传。
    let currentTask = null;

    cancelButton.addEventListener('click', () => {
      if (currentTask) currentTask.cancel();
      status.textContent = '正在取消上传...';
      cancelButton.disabled = true;
    });

    // 拦截表单默认提交，改为由 JavaScript 完成 OSS 上传，避免页面刷新。
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      const authorization = authorizationInput.value.trim();
      // true 使用分片上传，false 使用普通 put 上传。
      const useMultipart = uploadModeInput.value === 'multipart';

      if (!file || !authorization) {
        status.textContent = '请选择文件并填写 Basic Authorization。';
        return;
      }

      uploadButton.disabled = true;
      cancelButton.disabled = false;
      progress.hidden = false;
      progress.value = 0;
      result.hidden = true;
      result.textContent = '';
      status.textContent = '正在获取临时授权...';

      try {
        status.textContent = '正在获取临时授权...';
        const credentials = await getCredentials(authorization);

        status.textContent = useMultipart ? '正在分片上传...' : '正在普通上传...';
        currentTask = uploadFile({
          file,
          credentials,
          region: 'oss-cn-shenzhen',
          bucket: 'ww-bfb',
          uploadHost: 'https://oss-cn-shenzhen.aliyuncs.com',
          viewHost: 'https://wwossview.hkbf.com.cn',
          useMultipart,
          partSize: 100 * 1024,
          progress: (percentage) => {
            progress.value = percentage;
            console.log(`上传进度：${percentage.toFixed(0)}%`);
          },
          success: ({ url }) => {
            progress.value = 100;
            status.textContent = '上传成功。';
            result.innerHTML = `访问地址：<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
            result.hidden = false;
          },
          fail: (error) => {
            if (error.code !== 'UPLOAD_CANCELLED') {
              console.error(error);
            }
          }
        });
        await currentTask;
      } catch (error) {
        progress.value = 0;
        if (error.code === 'UPLOAD_CANCELLED') {
          status.textContent = '上传已取消。';
        } else {
          status.textContent = `上传失败：${error.message}`;
        }
      } finally {
        currentTask = null;
        uploadButton.disabled = false;
        cancelButton.disabled = true;
      }
    });
  </script>
</body>

</html>
