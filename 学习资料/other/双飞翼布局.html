<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .clearfix{
            zoom: 1;
        }
        .clearfix::after{
            content: "";
            display: block;
            height: 0;
            clear: both;
        }
        .col{
            float: left;
            width: 200px;
            min-height: 200px;
            background-color: blanchedalmond;
        }
        .center{
            width: 100%;
            min-height: 200px;
            float: left;
            background-color: blue;
        }
        .center .content{
            margin: 0 200px;
            color: #fff;
        }
        .left{
            margin-left: -100%;
        }
        .right{
            margin-left: -200px;
        }

    </style>
</head>
<body>
    <div class="box clearfix">
        <div class="center">
            <div class="content">他合同和认同核桃仁</div>
        </div>
        <div class="left col">左</div>
        <div class="right col">右</div>
    </div>
</body>
</html>
