<script>
    class Person {
        constructor(name,age,sex){// 实例化的时候执行的方法
            this.name = name;
            this.age = age;
            this.sex = sex;
        }
        showName(){
            console.log(this.name)
        }
        showAge(){
            console.log(this.age)
        }
        get getSex(){
            return this.sex
        }
        set setSex(value){
            this.sex = value
        }
    }
    let person = new Person('Yang',100,'男');
    person.showName();
    person.showAge();
    console.log('---',person.setSex = '1')
    console.log('---',person.getSex)


    class worker extends Person{

            console.log(data)
        }

    let work = new worker('Yang2',99,'web');
