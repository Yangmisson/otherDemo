<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迭代器</title>
  </head>
  <body>
    <script>
      const obj = {
        name: "demo",
        model: ["首页", "日程", "拜访", "报表", "我的"],
        [Symbol.iterator]() {
          let index = 0,
            _this = this.model;
          return {
            next() {
              if (index < _this.length) {
                return { value: _this[index++], done: false };
              } else {
                return { value: undefined, done: true };
              }
            },
          };
        },
      };
      for (const val of obj) {
        console.log(val);
      }
    </script>
  </body>
</html>
